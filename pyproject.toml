[project]
name = "pupila"
version = "0.7.1"
description = "A Matrix client for the terminal, without Vim modes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=8,<9",
    "textual-image>=0.14",
    "httpx>=0.27",
    "pillow>=10",
]

[project.scripts]
pupila = "pupila.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pupila"]
